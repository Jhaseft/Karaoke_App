services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs

volumes:
  storage_data:
  logs:
